  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: ./charts/dpu-cluster-kubeconfig
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-gitops
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: dpf-config
  valuesFrom:
  - kind: ConfigMap
    name: gitops-overrides-dpu-cluster-kubeconfig
    valuesKey: values.yaml
    optional: true
