apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dpf-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: dpf-operator
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: dpf-operator
      version: v26.4.0
      sourceRef:
        kind: HelmRepository
        name: doca
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: argo-cd
  - name: maintenance-operator
  - name: node-feature-discovery
  valuesFrom:
  - kind: ConfigMap
    name: gitops-defaults-dpf-operator
    valuesKey: values.yaml
  - kind: ConfigMap
    name: gitops-overrides-dpf-operator
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dpf-config
  namespace: flux-system
spec:
  interval: 10m
  releaseName: dpf-config
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: ./charts/dpf-config
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-gitops
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: dpf-operator
  valuesFrom:
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: dpfApiServerVip
    targetPath: apiServer.vip
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: dpfApiServerPort
    targetPath: apiServer.port
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: dpuClusterMaxNodes
    targetPath: dpuCluster.maxNodes
  - kind: ConfigMap
    name: gitops-overrides-dpf-config
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dpu-cluster-kubeconfig
  namespace: flux-system
spec:
