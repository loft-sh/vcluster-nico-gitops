apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dpf-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: dpf-operator
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: dpf-operator
      version: v26.4.0
      sourceRef:
        kind: HelmRepository
        name: doca
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: argo-cd
  - name: kamaji-datastore
  - name: maintenance-operator
  - name: node-feature-discovery
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-defaults-dpf-operator
    valuesKey: values.yaml
  - kind: ConfigMap
    name: blueprint-overrides-dpf-operator
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dpf-config
  namespace: flux-system
spec:
  interval: 10m
  releaseName: dpf-config
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: ./charts/dpf-config
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-blueprints
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: dpf-operator
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: dpfApiServerVip
    targetPath: apiServer.vip
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: dpfApiServerPort
    targetPath: apiServer.port
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: dpuClusterInterface
    targetPath: dpuCluster.keepalived.interface
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: dpuClusterVip
    targetPath: dpuCluster.keepalived.vip
  - kind: ConfigMap
    name: blueprint-overrides-dpf-config
    valuesKey: values.yaml
    optional: true
