  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: ./charts/kamaji-datastore
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-blueprints
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: kamaji
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-overrides-kamaji-datastore
    valuesKey: values.yaml
    optional: true
---
