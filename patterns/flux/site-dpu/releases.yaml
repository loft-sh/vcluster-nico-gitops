apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-cd
  namespace: flux-system
spec:
  interval: 10m
  releaseName: argo-cd
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: argo-cd
      version: 9.4.1
      sourceRef:
        kind: HelmRepository
        name: argo
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-defaults-argo-cd
    valuesKey: values.yaml
  - kind: ConfigMap
    name: blueprint-overrides-argo-cd
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kamaji
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kamaji
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: kamaji
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: nvidia-charts
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
    disableWait: true
  dependsOn:
  - name: cert-manager
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-defaults-kamaji
    valuesKey: values.yaml
  - kind: ConfigMap
    name: blueprint-overrides-kamaji
    valuesKey: values.yaml
    optional: true
---
