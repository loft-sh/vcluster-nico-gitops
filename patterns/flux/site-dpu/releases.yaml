apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-cd
  namespace: flux-system
spec:
  interval: 10m
  releaseName: argo-cd
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: argo-cd
      version: 9.4.1
      sourceRef:
        kind: HelmRepository
        name: argo
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: gitops-defaults-argo-cd
    valuesKey: values.yaml
  - kind: ConfigMap
    name: gitops-overrides-argo-cd
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintenance-operator
  namespace: flux-system
spec:
  interval: 10m
  releaseName: maintenance-operator
  targetNamespace: dpf-operator-system
  storageNamespace: dpf-operator-system
  chart:
    spec:
      chart: maintenance-operator-chart
      version: 0.3.0
      sourceRef:
        kind: HelmRepository
        name: mellanox
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: cert-manager
  valuesFrom:
  - kind: ConfigMap
    name: gitops-defaults-maintenance-operator
    valuesKey: values.yaml
  - kind: ConfigMap
    name: gitops-overrides-maintenance-operator
    valuesKey: values.yaml
    optional: true
---
