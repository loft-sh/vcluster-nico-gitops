apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 10m
  releaseName: vault
  targetNamespace: vault
  storageNamespace: vault
  chart:
    spec:
      chart: vault
      version: 0.34.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
    disableWait: true
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
    disableWait: true
  valuesFrom:
  - kind: ConfigMap
    name: gitops-defaults-vault
    valuesKey: values.yaml
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: storageClass
    targetPath: server.dataStorage.storageClass
  - kind: ConfigMap
    name: gitops-overrides-vault
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-unseal
  namespace: flux-system
spec:
  interval: 10m
  releaseName: vault-unseal
  targetNamespace: vault
  storageNamespace: vault
  chart:
    spec:
      chart: ./charts/vault-unseal
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-gitops
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: vault
  valuesFrom:
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: vaultKvMount
    targetPath: kvMount
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: vaultPkiMount
    targetPath: pki.mount
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: vaultPkiRole
    targetPath: pki.role
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: vaultCertManagerAuthMount
    targetPath: certManager.authMount
  - kind: ConfigMap
    name: gitops-settings
    valuesKey: vaultCertManagerRole
    targetPath: certManager.role
  - kind: ConfigMap
    name: gitops-overrides-vault-unseal
    valuesKey: values.yaml
    optional: true
