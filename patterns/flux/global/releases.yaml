apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: v1.20.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-overrides-cert-manager
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: global-prereqs
  namespace: flux-system
spec:
  interval: 10m
  releaseName: global-prereqs
  targetNamespace: nico-rest
  storageNamespace: nico-rest
  chart:
    spec:
      chart: ./charts/global-prereqs
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-blueprints
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: cert-manager
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: storageClass
    targetPath: postgres.storageClass
  - kind: ConfigMap
    name: blueprint-overrides-global-prereqs
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: flux-system
spec:
  interval: 10m
  releaseName: temporal
  targetNamespace: temporal
  storageNamespace: temporal
  chart:
    spec:
      chart: ./rest-api/temporal-helm/temporal
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nico-charts
      valuesFiles:
      - ./rest-api/temporal-helm/temporal/values.yaml
      - ./rest-api/temporal-helm/temporal/values-kind.yaml
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: global-prereqs
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-defaults-temporal
    valuesKey: values.yaml
  - kind: ConfigMap
    name: blueprint-overrides-temporal
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
