apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nico-rest
  namespace: flux-system
spec:
  interval: 10m
  releaseName: nico-rest
  targetNamespace: nico-rest
  storageNamespace: nico-rest
  chart:
    spec:
      chart: ./helm/rest/nico-rest
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: nico-charts
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: temporal-namespaces
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-defaults-nico-rest
    valuesKey: values.yaml
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: platformOidcIssuer
    targetPath: nico-rest-api.config.issuers[0].issuer
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: siteManagerHost
    targetPath: nico-rest-site-manager.certificate.dnsNames[5]
  - kind: ConfigMap
    name: blueprint-overrides-nico-rest
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vcluster-platform
  namespace: flux-system
spec:
  interval: 10m
  releaseName: vcluster-platform
  targetNamespace: vcluster-platform
  storageNamespace: vcluster-platform
  chart:
    spec:
      chart: vcluster-platform
      version: 5.0.0-rc.1
      sourceRef:
        kind: HelmRepository
        name: loft
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: cert-manager
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-defaults-vcluster-platform
    valuesKey: values.yaml
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: platformHost
    targetPath: config.loftHost
  - kind: ConfigMap
    name: blueprint-overrides-vcluster-platform
    valuesKey: values.yaml
    optional: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nico-provider
  namespace: flux-system
spec:
  interval: 10m
  releaseName: nico-provider
  targetNamespace: vcluster-platform
  storageNamespace: vcluster-platform
  chart:
    spec:
      chart: ./charts/nico-provider
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: vcluster-nico-blueprints
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  dependsOn:
  - name: vcluster-platform
  - name: nico-rest
  valuesFrom:
  - kind: ConfigMap
    name: blueprint-settings
    valuesKey: nicoOrg
    targetPath: org
  - kind: ConfigMap
    name: blueprint-overrides-nico-provider
    valuesKey: values.yaml
    optional: true
