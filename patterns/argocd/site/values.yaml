gitops:
  repoURL: https://github.com/example-org/vcluster-nico-gitops.git
  targetRevision: v0.1.0
environment:
  repoURL: https://github.com/example-org/nico-environments.git
  targetRevision: main
  path: clusters/site-1/nico
argocd:
  namespace: argocd
  project: default
destination:
  server: https://kubernetes.default.svc
namePrefix: ''
data: {}
ociRepositories:
- ghcr.io/loft-sh/vcluster-platform-nico/charts
components:
- name: vcluster-platform-agent
  releaseName: vcluster-platform-agent
  namespace: vcluster-platform
  wave: 0
  serverSideDiff: true
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster-platform
    targetRevision: 5.0.0-rc.1
  valueFiles:
  - $gitops/values/site/vcluster-platform-agent.yaml
  - $env/{path}/overrides/vcluster-platform-agent.yaml
- name: nico
  releaseName: nico
  namespace: nico-system
  wave: 0
  serverSideDiff: true
  source:
    repoURL: ghcr.io/loft-sh/vcluster-platform-nico/charts
    chart: nico
    targetRevision: 2.4.0-vcluster.rc5.1.g3d8bdad7
  valueFiles:
  - $gitops/values/site/nico.yaml
  - $env/{path}/overrides/nico.yaml
  settings:
  - key: vaultAddr
    path: nico-api.vaultClusterInfo.VAULT_SERVICE
  - key: vaultKvMount
    path: nico-api.vaultClusterInfo.NICO_VAULT_MOUNT
  - key: vaultPkiMount
    path: nico-api.vaultClusterInfo.NICO_VAULT_PKI_MOUNT
- name: nico-site-agent
  releaseName: nico-rest-site-agent
  namespace: nico-rest
  wave: 1
  serverSideDiff: true
  source:
    repoURL: ghcr.io/loft-sh/vcluster-platform-nico/charts
    chart: nico-rest-site-agent
    targetRevision: 2.4.0-vcluster.rc5.1.g3d8bdad7
  valueFiles:
  - $gitops/values/site/nico-site-agent.yaml
  - $env/{path}/overrides/nico-site-agent.yaml
  settings:
  - key: siteId
    path: envConfig.CLUSTER_ID
  - key: siteId
    path: envConfig.TEMPORAL_SUBSCRIBE_NAMESPACE
  - key: temporalHost
    path: envConfig.TEMPORAL_HOST
