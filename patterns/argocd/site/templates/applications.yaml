{{- range .Values.components }}
{{- $c := . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $.Values.namePrefix }}{{ $c.name }}
  namespace: {{ $.Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $c.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.argocd.project }}
  destination:
    server: {{ $.Values.destination.server }}
    namespace: {{ $c.namespace }}
  sources:
    {{- if $c.source.nico }}
    - repoURL: {{ $.Values.nico.repoURL }}
      targetRevision: {{ $.Values.nico.targetRevision }}
      path: {{ $c.source.path }}
    {{- else if $c.source.blueprint }}
    - repoURL: {{ $.Values.blueprint.repoURL }}
      targetRevision: {{ $.Values.blueprint.targetRevision }}
      path: {{ $c.source.path }}
    {{- else }}
    - repoURL: {{ $c.source.repoURL }}
      chart: {{ $c.source.chart }}
      targetRevision: {{ $c.source.targetRevision }}
    {{- end }}
      helm:
        releaseName: {{ $c.releaseName }}
        ignoreMissingValueFiles: true
        valueFiles:
          {{- range $c.valueFiles }}
          - {{ replace "{path}" $.Values.environment.path . }}
          {{- end }}
        {{- with $c.settings }}
        parameters:
          {{- range . }}
          - name: {{ .path }}
            value: {{ index $.Values.data .key | default "" | quote }}
            forceString: true
          {{- end }}
        {{- end }}
        {{- with $c.values }}
        valuesObject:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    - repoURL: {{ $.Values.blueprint.repoURL }}
      targetRevision: {{ $.Values.blueprint.targetRevision }}
      ref: blueprint
    - repoURL: {{ $.Values.environment.repoURL }}
      targetRevision: {{ $.Values.environment.targetRevision }}
      ref: env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
{{- end }}
