gitops:
  repoURL: https://github.com/example-org/vcluster-nico-gitops.git
  targetRevision: v0.1.0
environment:
  repoURL: https://github.com/example-org/nico-environments.git
  targetRevision: main
  path: clusters/site-1/nico
argocd:
  namespace: argocd
  project: default
destination:
  server: https://kubernetes.default.svc
namePrefix: ''
data: {}
ociRepositories:
- ghcr.io/nvidia/charts
- ghcr.io/mellanox
components:
- name: argo-cd
  releaseName: argo-cd
  namespace: dpf-operator-system
  wave: 0
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 9.4.1
  valueFiles:
  - $gitops/values/site-dpu/argo-cd.yaml
  - $env/{path}/overrides/argo-cd.yaml
- name: kamaji
  releaseName: kamaji
  namespace: dpf-operator-system
  wave: 0
  source:
    repoURL: ghcr.io/nvidia/charts
    chart: kamaji
    targetRevision: 1.2.0
  valueFiles:
  - $gitops/values/site-dpu/kamaji.yaml
  - $env/{path}/overrides/kamaji.yaml
- name: kamaji-datastore
  releaseName: kamaji-datastore
  namespace: dpf-operator-system
  wave: 0
  source:
    gitops: true
    path: charts/kamaji-datastore
  valueFiles:
  - $env/{path}/overrides/kamaji-datastore.yaml
- name: maintenance-operator
  releaseName: maintenance-operator
  namespace: dpf-operator-system
  wave: 0
  source:
    repoURL: ghcr.io/mellanox
    chart: maintenance-operator-chart
    targetRevision: 0.3.0
  valueFiles:
  - $gitops/values/site-dpu/maintenance-operator.yaml
  - $env/{path}/overrides/maintenance-operator.yaml
- name: node-feature-discovery
  releaseName: node-feature-discovery
  namespace: dpf-operator-system
  wave: 0
  source:
    repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    chart: node-feature-discovery
    targetRevision: 0.18.3
  valueFiles:
  - $gitops/values/site-dpu/node-feature-discovery.yaml
  - $env/{path}/overrides/node-feature-discovery.yaml
- name: dpf-operator
  releaseName: dpf-operator
  namespace: dpf-operator-system
  wave: 1
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia/doca
    chart: dpf-operator
    targetRevision: v26.4.0
  valueFiles:
  - $gitops/values/site-dpu/dpf-operator.yaml
  - $env/{path}/overrides/dpf-operator.yaml
- name: dpf-config
  releaseName: dpf-config
  namespace: dpf-operator-system
  wave: 2
  source:
    gitops: true
    path: charts/dpf-config
  valueFiles:
  - $env/{path}/overrides/dpf-config.yaml
  settings:
  - key: dpfApiServerVip
    path: apiServer.vip
  - key: dpfApiServerPort
    path: apiServer.port
  - key: dpuClusterInterface
    path: dpuCluster.keepalived.interface
  - key: dpuClusterVip
    path: dpuCluster.keepalived.vip
