apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vcluster-nico-gitops
  namespace: flux-system
spec:
  interval: 10m
  url: GITOPS_URL
  ref:
    branch: GITOPS_BRANCH
    commit: GITOPS_COMMIT
  secretRef:
    name: gitops-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-vault-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/vault-config
  prune: true
  wait: true
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site-base
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site-base
  prune: true
  wait: true
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site
  prune: true
  wait: false
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
  dependsOn:
  - name: nico-site-base
