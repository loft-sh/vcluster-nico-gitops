apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vcluster-nico-blueprints
  namespace: flux-system
spec:
  interval: 10m
  url: BLUEPRINT_URL
  ref:
    branch: BLUEPRINT_BRANCH
    commit: BLUEPRINT_COMMIT
  secretRef:
    name: blueprint-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site-base
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site-base
  prune: true
  wait: true
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-blueprints
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site
  prune: true
  wait: false
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-blueprints
  dependsOn:
  - name: nico-site-base
