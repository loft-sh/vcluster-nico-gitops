apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-settings
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  platformHost: PLATFORM_IP
  platformOidcIssuer: https://PLATFORM_IP/oidc
  siteManagerHost: SITE_MANAGER_HOST
  storageClass: standard
  nicoOrg: vcluster-autonodes
