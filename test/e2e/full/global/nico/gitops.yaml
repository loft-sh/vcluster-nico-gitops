apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vcluster-nico-gitops
  namespace: flux-system
spec:
  interval: 10m
  url: GITOPS_URL
  ref:
    branch: GITOPS_BRANCH
    commit: GITOPS_COMMIT
  secretRef:
    name: gitops-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-global
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/global
  prune: true
  wait: true
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
