apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vcluster-nico-blueprints
  namespace: flux-system
spec:
  interval: 10m
  url: BLUEPRINT_URL
  ref:
    branch: BLUEPRINT_BRANCH
    commit: BLUEPRINT_COMMIT
  secretRef:
    name: blueprint-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-global
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/global
  prune: true
  wait: true
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-blueprints
