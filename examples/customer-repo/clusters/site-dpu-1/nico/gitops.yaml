apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vcluster-nico-gitops
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/loft-sh/vcluster-nico-gitops
  ref:
    tag: v0.2.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-vault-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/vault-config
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site-base
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site-base
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site-dpu
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site-dpu
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
  dependsOn:
  - name: nico-site-base
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nico-site
  namespace: flux-system
spec:
  interval: 10m
  path: ./patterns/flux/site
  prune: true
  wait: false
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: vcluster-nico-gitops
  dependsOn:
  - name: nico-site-base
  - name: nico-site-dpu
