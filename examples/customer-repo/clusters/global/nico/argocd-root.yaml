apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nico-global
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
  - repoURL: https://github.com/loft-sh/vcluster-nico-gitops.git
    targetRevision: v0.2.0
    path: patterns/argocd/global
    helm:
      valueFiles:
      - $env/clusters/global/nico/settings.yaml
      valuesObject:
        gitops:
          repoURL: https://github.com/loft-sh/vcluster-nico-gitops.git
          targetRevision: v0.2.0
        environment:
          repoURL: https://github.com/example-org/nico-environments.git
          targetRevision: main
          path: clusters/global/nico
  - repoURL: https://github.com/example-org/nico-environments.git
    targetRevision: main
    ref: env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
