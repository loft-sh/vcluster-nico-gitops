apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
- name: gitops-defaults-argo-cd
  files:
  - values.yaml=argo-cd.yaml
- name: gitops-defaults-kamaji
  files:
  - values.yaml=kamaji.yaml
- name: gitops-defaults-maintenance-operator
  files:
  - values.yaml=maintenance-operator.yaml
- name: gitops-defaults-node-feature-discovery
  files:
  - values.yaml=node-feature-discovery.yaml
- name: gitops-defaults-dpf-operator
  files:
  - values.yaml=dpf-operator.yaml
