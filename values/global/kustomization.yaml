apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
- name: gitops-defaults-temporal
  files:
  - values.yaml=temporal.yaml
- name: gitops-defaults-nico-rest
  files:
  - values.yaml=nico-rest.yaml
- name: gitops-defaults-vcluster-platform
  files:
  - values.yaml=vcluster-platform.yaml
