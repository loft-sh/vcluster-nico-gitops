global:
  image:
    repository: ghcr.io/loft-sh/vcluster-platform-nico/nico
    tag: v2.4.0-vcluster.rc5.1.g3d8bdad7
  imagePullSecrets: []
  certificate:
    issuerRef:
      kind: ClusterIssuer
      name: vault-nico-issuer
      group: cert-manager.io
nico-api:
  automountServiceAccountToken: false
  envFrom:
    vaultToken:
      secretName: nico-vault-token
    databaseCredentials:
      secretName: nico-system.nico.nico-pg-cluster.credentials
  vaultClusterInfo:
    VAULT_SERVICE: https://vault.example.com
    NICO_VAULT_MOUNT: nico-kv
    NICO_VAULT_PKI_MOUNT: nico-pki
  databaseConfig:
    DB_HOST: nico-postgres.nico-system.svc.cluster.local
    DB_PORT: '5432'
    DB_NAME: nico
  migrationJob:
    enabled: true
    sslMode: disable
  externalService:
    enabled: false
nico-pxe:
  bootArtifactContainers:
  - name: boot-artifacts-x86-64
    repository: ghcr.io/loft-sh/vcluster-platform-nico/boot-artifacts-x86_64
    tag: v2.4.0-vcluster.rc5.1.g3d8bdad7
    command:
    - sh
    - -c
    - set -e; cp -r /x86_64 /forge-boot-artifacts/blobs/internal
  - name: boot-artifacts-aarch64
    repository: ghcr.io/loft-sh/vcluster-platform-nico/boot-artifacts-aarch64
    tag: v2.4.0-vcluster.rc5.1.g3d8bdad7
    command:
    - sh
    - -c
    - set -e; cp -r /aarch64 /apt /forge-boot-artifacts/blobs/internal
