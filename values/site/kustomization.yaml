apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
- name: gitops-defaults-vcluster-platform-agent
  files:
  - values.yaml=vcluster-platform-agent.yaml
- name: gitops-defaults-nico
  files:
  - values.yaml=nico.yaml
- name: gitops-defaults-nico-site-agent
  files:
  - values.yaml=nico-site-agent.yaml
