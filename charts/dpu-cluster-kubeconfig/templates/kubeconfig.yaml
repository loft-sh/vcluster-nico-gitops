apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Values.namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: dpu-cluster
  namespace: {{ .Values.namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.source.namespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.serviceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.target }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: dpu-cluster
  target:
    name: {{ .Values.target }}
    creationPolicy: Owner
    template:
      data:
        super-admin.conf: {{ "{{ .config }}" | quote }}
  data:
    - secretKey: config
      remoteRef:
        key: {{ .Values.source.secret }}
        property: config
