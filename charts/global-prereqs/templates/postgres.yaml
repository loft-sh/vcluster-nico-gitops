{{- if .Values.postgres.enabled }}
{{- $p := .Values.postgres }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Values.namespaces.nicoRest }}
data:
  001-create-roles-and-databases.sh: |
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v rest_password="$NICO_REST_PASSWORD" -v temporal_password="$TEMPORAL_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', '{{ $p.nicoRest.user }}', :'rest_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $p.nicoRest.user }}')\gexec
    SELECT format('CREATE ROLE %I LOGIN CREATEDB PASSWORD %L', '{{ $p.temporal.user }}', :'temporal_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $p.temporal.user }}')\gexec
    SELECT 'CREATE DATABASE {{ $p.nicoRest.database }} OWNER {{ $p.nicoRest.user }}'
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ $p.nicoRest.database }}')\gexec
    SELECT 'CREATE DATABASE {{ $p.temporal.database }} OWNER {{ $p.temporal.user }}'
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ $p.temporal.database }}')\gexec
    SELECT 'CREATE DATABASE {{ $p.temporal.visibilityDatabase }} OWNER {{ $p.temporal.user }}'
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ $p.temporal.visibilityDatabase }}')\gexec
    SQL
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname {{ $p.nicoRest.database }} <<'SQL'
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gin;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespaces.nicoRest }}
spec:
  selector:
    app.kubernetes.io/name: nico-rest-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespaces.nicoRest }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nico-rest-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nico-rest-postgres
    spec:
      containers:
        - name: postgres
          image: {{ $p.image }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.credentialsSecret }}
                  key: admin_password
            - name: NICO_REST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.credentialsSecret }}
                  key: nico_rest_password
            - name: TEMPORAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.credentialsSecret }}
                  key: temporal_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $p.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.size }}
{{- end }}
