{{- with .Values.nicoApiKubeconfig }}
{{- if .enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nico-api-kubeconfig
  namespace: {{ .namespace }}
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: local
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: {{ .mountPath }}/ca.crt
    users:
      - name: nico-api
        user:
          tokenFile: {{ .mountPath }}/token
    contexts:
      - name: local
        context:
          cluster: local
          user: nico-api
          namespace: {{ .namespace }}
    current-context: local
{{- end }}
{{- end }}
