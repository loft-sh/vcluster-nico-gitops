{{- $v := .Values.vault }}
{{- $cm := $v.certManager }}
{{- $ns := .Values.namespaces.certManager }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cm.serviceAccount }}
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.issuer.name }}-token
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ $cm.serviceAccount | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.issuer.name }}-token
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.issuer.name }}-token
subjects:
  - kind: ServiceAccount
    name: {{ $cm.controllerServiceAccount }}
    namespace: {{ $ns }}
{{- if $cm.authDelegator }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cm.serviceAccount }}-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ $cm.serviceAccount }}
    namespace: {{ $ns }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuer.name }}
spec:
  vault:
    server: {{ $v.address }}
    path: {{ $v.pkiMount }}/sign/{{ $v.pkiRole }}
    {{- with $v.caBundle }}
    caBundle: {{ . }}
    {{- end }}
    auth:
      kubernetes:
        mountPath: /v1/auth/{{ $cm.authMount }}
        role: {{ $cm.role }}
        serviceAccountRef:
          name: {{ $cm.serviceAccount }}
          {{- with $cm.audiences }}
          audiences:
            {{- toYaml . | nindent 12 }}
          {{- end }}
