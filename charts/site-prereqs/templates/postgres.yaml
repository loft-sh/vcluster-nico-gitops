{{- if .Values.postgres.enabled }}
{{- $p := .Values.postgres }}
{{- $ns := .Values.namespaces.nico }}
{{- if $p.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nico-postgres-tls
  namespace: {{ $ns }}
spec:
  secretName: nico-postgres-tls
  commonName: nico-postgres.{{ $ns }}.svc.cluster.local
  dnsNames:
    - nico-postgres.{{ $ns }}.svc.cluster.local
    - nico-postgres.{{ $ns }}
    - nico-postgres
  duration: {{ $p.tls.duration }}
  renewBefore: {{ $p.tls.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer.name }}
    group: cert-manager.io
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nico-postgres-init
  namespace: {{ $ns }}
data:
  001-create-role-and-database.sh: |
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres -v app_password="$APP_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', '{{ $p.user }}', :'app_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $p.user }}')\gexec
    SELECT 'CREATE DATABASE {{ $p.database }} OWNER {{ $p.user }}'
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ $p.database }}')\gexec
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: nico-postgres
  namespace: {{ $ns }}
spec:
  selector:
    app.kubernetes.io/name: nico-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nico-postgres
  namespace: {{ $ns }}
spec:
  serviceName: nico-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nico-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nico-postgres
    spec:
      {{- if $p.tls.enabled }}
      initContainers:
        - name: tls
          image: {{ $p.image }}
          command: ["sh", "-c", "install -o postgres -g postgres -m 600 /tls-secret/tls.key /tls/tls.key && install -o postgres -g postgres -m 644 /tls-secret/tls.crt /tls/tls.crt"]
          volumeMounts:
            - name: tls-secret
              mountPath: /tls-secret
            - name: tls
              mountPath: /tls
      {{- end }}
      containers:
        - name: postgres
          image: {{ $p.image }}
          {{- if $p.tls.enabled }}
          args: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/tls.crt", "-c", "ssl_key_file=/tls/tls.key"]
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.credentialsSecret }}
                  key: admin_password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.credentialsSecret }}
                  key: app_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            {{- if $p.tls.enabled }}
            - name: tls
              mountPath: /tls
            - name: socket
              mountPath: /var/run/postgresql
            {{- end }}
        {{- if $p.tls.enabled }}
        - name: tls-reload
          image: {{ $p.image }}
          command:
            - sh
            - -c
            - |
              while sleep 300; do
                cmp -s /tls-secret/tls.crt /tls/tls.crt && cmp -s /tls-secret/tls.key /tls/tls.key && continue
                install -o postgres -g postgres -m 600 /tls-secret/tls.key /tls/tls.key
                install -o postgres -g postgres -m 644 /tls-secret/tls.crt /tls/tls.crt
                psql -h /var/run/postgresql -U postgres -tAc 'select pg_reload_conf()'
              done
          volumeMounts:
            - name: tls-secret
              mountPath: /tls-secret
            - name: tls
              mountPath: /tls
            - name: socket
              mountPath: /var/run/postgresql
        {{- end }}
      volumes:
        - name: init
          configMap:
            name: nico-postgres-init
            defaultMode: 0555
        {{- if $p.tls.enabled }}
        - name: tls-secret
          secret:
            secretName: nico-postgres-tls
        - name: tls
          emptyDir: {}
        - name: socket
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $p.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.size }}
{{- end }}
